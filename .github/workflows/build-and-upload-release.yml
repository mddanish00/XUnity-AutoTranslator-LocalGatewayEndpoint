on:
  workflow_call:
    inputs:
      repo_tag:
        description: 'The tag of the repository to use'
        required: true
        type: string
      xuat_version:
        description: 'The version of XUAT to use for building the release without v'
        required: true
        type: string
      build_only:
        description: 'If true, only build the release without uploading it'
        required: false
        type: boolean
        default: false

name: Build and Upload Release

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: read # To checkout the repository
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.repo_tag }}

      - name: Setup .NET
        uses: fast-actions/setup-dotnet@v1
        with:
          sdk-version: 'lts'

      - name: Cache and download XUAT dependencies
        id: cache-xuat
        uses: actions/cache@v6
        with:
          path: |
            XUnity.AutoTranslator-Developer-${{ inputs.xuat_version }}.zip
            XUnity.AutoTranslator-Developer-IL2CPP-${{ inputs.xuat_version }}.zip
          key: xuat-cache-${{ inputs.xuat_version }}
      
      - name: Download XUAT dependencies if not cached
        if: steps.cache-xuat.outputs.cache-hit != 'true'
        run: |
          Invoke-WebRequest https://github.com/bbepis/XUnity.AutoTranslator/releases/download/v${{ inputs.xuat_version }}/XUnity.AutoTranslator-Developer-${{ inputs.xuat_version }}.zip -OutFile XUnity.AutoTranslator-Developer-${{ inputs.xuat_version }}.zip
          Invoke-WebRequest https://github.com/bbepis/XUnity.AutoTranslator/releases/download/v${{ inputs.xuat_version }}/XUnity.AutoTranslator-Developer-IL2CPP-${{ inputs.xuat_version }}.zip -OutFile XUnity.AutoTranslator-Developer-IL2CPP-${{ inputs.xuat_version }}.zip

      - name: Set up libs and libs-il2cpp
        run: |
            Expand-Archive -Path XUnity.AutoTranslator-Developer-${{ inputs.xuat_version }}.zip -DestinationPath .
            Copy-Item -Path "Developer\*" -Destination "libs" -Recurse -Force
            Remove-Item -Path "Developer" -Recurse -Force
            Expand-Archive -Path XUnity.AutoTranslator-Developer-IL2CPP-${{ inputs.xuat_version }}.zip -DestinationPath .
            Copy-Item -Path "Developer\*" -Destination "libs-il2cpp" -Recurse -Force
            Remove-Item -Path "Developer" -Recurse -Force

      - name: Build the project
        run: |
          dotnet build -c Release -v n

      - name: Zip the DLLs
        shell: python
        run: |
          import zipfile
          from pathlib import Path

          f35 = zipfile.ZipFile('LocalGatewayEndpoint-${{ inputs.repo_tag }}.zip', 'w', zipfile.ZIP_DEFLATED)
          f60 = zipfile.ZipFile('LocalGatewayEndpoint-IL2CPP-${{ inputs.repo_tag }}.zip', 'w', zipfile.ZIP_DEFLATED)

          f35.write('LocalGatewayEndpoint/bin/Release/net35/LocalGateway.dll', arcname='LocalGateway.dll')
          f60.write('LocalGatewayEndpoint/bin/Release/net6.0/LocalGateway.dll', arcname='LocalGateway.dll')

          # Add SampleConfig directory to both zip files
          [f35.write(p, arcname=p.relative_to('SampleConfig')._str if False else p.relative_to(Path('SampleConfig').parent)) for p in Path('SampleConfig').rglob('*') if p.is_file()]
          [f60.write(p, arcname=p.relative_to('SampleConfig')._str if False else p.relative_to(Path('SampleConfig').parent)) for p in Path('SampleConfig').rglob('*') if p.is_file()]

          # Add README.md and LICENSE to both zip files
          f35.write('README.md', arcname='README.md')
          f35.write('LICENSE', arcname='LICENSE')
          f60.write('README.md', arcname='README.md')
          f60.write('LICENSE', arcname='LICENSE')

          f35.close()
          f60.close()

      - name: Upload the zipped DLLs as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            LocalGatewayEndpoint-${{ inputs.repo_tag }}.zip
            LocalGatewayEndpoint-IL2CPP-${{ inputs.repo_tag }}.zip
          retention-days: 1

  upload-release:
    runs-on: ubuntu-latest
    needs: build-release
    if: ${{ inputs.build_only == false }}
    permissions:
      contents: write # To upload release assets and update the release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          
      - name: Update release and upload assets
        uses: actions/github-script@v9
        with:
          script: |
            const tag = '${{ inputs.repo_tag }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const release = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag,
            });

            const current_body = release.data.body || '';
            const new_line = `Build with XUAT version: v${{ inputs.xuat_version }}`;
            let new_body;

            if (current_body.includes("Build with XUAT version:")) {
              new_body = current_body.replace(/Build with XUAT version: .*/, new_line);
            } else {
              new_body = `${current_body}\n\n${new_line}`;
            }

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.data.id,
              body: new_body,
            });

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ inputs.repo_tag }} LocalGatewayEndpoint-${{ inputs.repo_tag }}.zip LocalGatewayEndpoint-IL2CPP-${{ inputs.repo_tag }}.zip --clobber --repo mddanish00/XUnity-AutoTranslator-LocalGatewayEndpoint
